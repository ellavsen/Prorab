name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Публикуем по одной сборке за раз, незавершённые не отменяем.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Собрать колёса ядра
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e .
          python scripts/prepare_web_assets.py

      - name: Установить фронт
        run: npm ci
        working-directory: apps/web

      - name: Сходимость с CPython
        # Демо не публикуется, если браузерное ядро считает иначе.
        run: npm run conformance
        working-directory: apps/web

      - name: Сборка
        run: npm run build
        working-directory: apps/web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
        with:
          # Включает Pages в настройках репозитория, если он ещё не включён,
          # и выставляет источником GitHub Actions.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
