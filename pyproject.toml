[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prorab"
version = "0.1.0"
description = "Прораб — AI-сметчик. Деньги считает код."
requires-python = ">=3.11"

# packages/ — библиотеки, apps/ — приложения. Оба корня ставятся в окружение.
[tool.setuptools.packages.find]
where = ["packages", "apps"]

# Справочник позиций — данные пакета, а не код: 173 строки в .py не влезли бы
# в лимит длины файла, да и место данным в файле данных.
#
# Шрифт объявлен здесь по той же причине, по которой он лежит в репозитории
# (ADR-021): без этой строки `pip install .` собирает колесо без .ttf, установка
# проходит молча, и PDF падает на первом вызове уже в контейнере. Тесты этого
# не ловили бы никогда — им путь задаёт pythonpath, то есть исходное дерево, где
# шрифт на месте. OFL.txt едет вместе со шрифтом не «за компанию»: лицензия
# требует, чтобы копия шрифта сопровождалась её текстом.
[tool.setuptools.package-data]
smeta_prices = ["*.json"]
smeta_export = ["fonts/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["python3"]

[tool.ruff.lint]
# Явный список — иначе «ruff не находит мёртвого кода» зависит от версии ruff.
# FURB не включаем: D("1") в тестах читается лучше, чем D(1).
select = ["E", "W", "F", "I", "UP", "DTZ", "ERA", "BLE", "RUF", "B", "SIM"]
# RUF001-003 помечают каждую кириллическую букву, похожую на латинскую. Интерфейс
# и комментарии в проекте русские по требованию — правило здесь только шумит.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["smeta_core", "smeta_prices", "smeta_storage", "smeta_export", "smeta_ai", "bot", "api", "bridge", "conftest"]

[tool.ruff.lint.per-file-ignores]
# В тестах длинные литералы и импорт из conftest — норма.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Тесты не зависят от того, установлен ли пакет: из свежего клона достаточно pytest.
pythonpath = ["packages", "apps", "tests"]
