# `docker compose up` поднимает проект без единого ключа — это требование
# мастер-плана (уровень 4), а не удобство. Поэтому бот вынесен в профиль:
# ему нужен TELEGRAM_BOT_TOKEN, и без токена он падает намеренно
# (bot/config.py: require_token). Сервис, который валится в рестарт-петлю,
# на демонстрации выглядит как сломанный проект.
#
#   docker compose up                    # api + share, ключи не нужны
#   docker compose --profile bot up      # и бот тоже, если .env заполнен
#
# Демо (apps/web) здесь нет намеренно — см. docs/deploy.md, «Чего здесь нет».

services:
  api:
    build: .
    image: prorab:local
    command: uvicorn api.main:app --host 0.0.0.0 --port 8001
    ports:
      - "127.0.0.1:8001:8001"
    # Ни базы, ни секретов, ни состояния — это главное свойство apps/api
    # (ADR-008), и тома у него поэтому нет.
    restart: unless-stopped
    healthcheck:
      # curl в slim-образе нет, и ставить его ради healthcheck не стоит.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8001/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  share:
    build: .
    image: prorab:local
    command: uvicorn share.main:app --host 0.0.0.0 --port 8000
    # Только на локальный интерфейс: наружу страницу выпускает nginx, который
    # терминирует TLS и режет токен в своём логе (ADR-020 §6). Порт, открытый
    # в мир напрямую, обошёл бы и то, и другое.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - prorab-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bot:
    build: .
    image: prorab:local
    command: python -m bot.app
    profiles: ["bot"]
    env_file:
      - path: .env
        required: false
    volumes:
      - prorab-data:/data
    # Порты не нужны: бот сам ходит в Telegram (long polling), входящих
    # соединений не принимает.
    restart: unless-stopped

volumes:
  # Именованный том, а не bind-mount: путь на хосте у всех разный, а забытый
  # том переживёт `docker compose down` — в отличие от anonymous.
  prorab-data:
